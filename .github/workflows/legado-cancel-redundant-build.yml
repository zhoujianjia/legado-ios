name: Cancel Redundant Legado Runtime Rebuild

# One-shot recovery for an accidentally selected full rebuild. The current
# runtime's source inputs are unchanged; its replacement uses native reuse.
on:
  push:
    tags:
      - 'legado-cancel-39104351010'

permissions:
  actions: write
  contents: read

jobs:
  cancel-fixed-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel only the verified redundant run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repository = os.environ['GITHUB_REPOSITORY']
          if repository != 'zhoujianjia/legado-ios':
              raise ValueError('Unexpected repository')
          url = 'https://api.github.com/repos/' + repository + '/actions/runs/39104351010'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
              run = json.load(response)
          if (run.get('head_sha') != 'aab2777ac3c615b5ae8660e04a9a18a5fadcc56e'
                  or run.get('head_branch') != 'legado-probe-aab2777'
                  or run.get('path') != '.github/workflows/legado-ios-prototype.yml'):
              raise ValueError('Refusing to cancel an unrelated workflow')
          if run.get('status') == 'completed':
              print(json.dumps({'runId': 39104351010, 'alreadyCompleted': True, 'conclusion': run.get('conclusion')}))
          else:
              request = urllib.request.Request(url + '/cancel', data=b'', headers=headers, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 202:
                      raise ValueError('Cancellation was not accepted')
              print(json.dumps({'runId': 39104351010, 'cancellationAccepted': True}))
          PY
