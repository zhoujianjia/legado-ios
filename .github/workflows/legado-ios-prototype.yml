name: Legado iOS Prototype

# Run explicitly by UI or a dedicated Git tag; this experiment compiles OpenJDK twice.
on:
  workflow_dispatch:
  push:
    tags:
      - 'legado-probe-*'

permissions:
  contents: read

concurrency:
  group: legado-ios-prototype-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  portable-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate portable tools and assemble the locked JVM payload
        run: |
          mkdir -p .build/ci-logs
          python -B -m unittest discover -s scripts/tests -p test_legado_inventory.py -v 2>&1 | tee .build/ci-logs/inventory-tests.log
          python -B scripts/legado-ios/test-runtime-tools.py -v 2>&1 | tee .build/ci-logs/runtime-tools-tests.log
          python -B scripts/legado-ios/test-zero-wx.py -v 2>&1 | tee .build/ci-logs/zero-wx-tests.log
          python -B scripts/legado-ios/test-zero-signal-context.py -v 2>&1 | tee .build/ci-logs/zero-signal-context-tests.log
          python -B scripts/legado-ios/test-fetch-sources.py -v 2>&1 | tee .build/ci-logs/fetch-sources-tests.log
          python -B scripts/legado-ios/test-native-reuse.py -v 2>&1 | tee .build/ci-logs/native-reuse-tests.log
          python -B scripts/legado-ios/test-http-wire.py -v 2>&1 | tee .build/ci-logs/http-wire-evidence-tests.log
          python -B scripts/legado-ios/test-cpu-loop.py -v 2>&1 | tee .build/ci-logs/cpu-loop-evidence-tests.log
          python -B -m unittest discover -s scripts/tests -p test_legado_simulator_probe.py -v 2>&1 | tee .build/ci-logs/simulator-runner-tests.log
          python -B scripts/legado-ios/test-zero-code-cache.py -v 2>&1 | tee .build/ci-logs/zero-code-cache-tests.log
          python -B scripts/legado-reference/test-compare-reference.py -v 2>&1 | tee .build/ci-logs/reference-comparator-tests.log
          bash Packages/LegadoRuntime/jvm/gradlew -p Packages/LegadoRuntime/jvm --no-daemon -PincludeEngineTests=true test runtimeJar runtimeSmoke runtimeSuiteSmoke runtimeWireSmoke runtimeCpuLoopSmoke probeDependencyEvidence 2>&1 | tee .build/ci-logs/jvm-tests.log
      - name: Save the portable payload for the Mac job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legado-jvm-payload
          path: Packages/LegadoRuntime/jvm/build/libs/legado-runtime.jar
          if-no-files-found: error
          retention-days: 7
      - name: Save portable test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legado-portable-test-logs
          path: |
            .build/ci-logs/
            Packages/LegadoRuntime/jvm/build/test-results/
            Packages/LegadoRuntime/jvm/build/reports/tests/
            Packages/LegadoRuntime/jvm/build/reports/dependency-verification/
            Packages/LegadoRuntime/jvm/build/reports/http-wire/
            Packages/LegadoRuntime/jvm/build/reports/cpu-loop/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  ios-probe:
    needs: portable-core
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: legado-jvm-payload
          path: Packages/LegadoRuntime/jvm/build/libs
      - name: Resolve the installed Apple toolchain
        run: |
          mkdir -p .build/ci-logs
          test "$(uname -m)" = arm64
          export DEVELOPER_DIR="$(bash scripts/sim.sh xcode)"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version 2>&1 | tee .build/ci-logs/xcode-version.log
          xcodebuild -showsdks 2>&1 | tee .build/ci-logs/apple-sdks.log
      - name: Test the Swift bridge without a native JVM
        env:
          LEGADO_RUNTIME_SOURCE_ONLY: '1'
        run: swift test --package-path Packages/LegadoRuntime 2>&1 | tee .build/ci-logs/swift-package-tests.log
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '26'
          architecture: aarch64
      - name: Prepare the Zero build tools
        run: |
          for tool in make autoconf; do
            if ! brew list --versions "$tool" >/dev/null; then brew install "$tool"; fi
          done
          java -version 2>&1 | tee .build/ci-logs/boot-jdk.log
          df -h . | tee .build/ci-logs/disk-before-build.log
      - name: Build the pinned device and simulator Zero runtime
        run: LEGADO_BOOT_JDK="$JAVA_HOME" bash scripts/legado-ios/build-zero.sh 2>&1 | tee .build/ci-logs/zero-build.log
      - name: Preserve the source-built native runtime for follow-up diagnosis
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legado-zero-source-build
          path: |
            Packages/LegadoRuntime/Artifacts/OpenJDK.xcframework/
            .build/legado-ios/device-static/java-home/
            .build/legado-ios/simulator-static/java-home/
            scripts/legado-ios/runtime-lock.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Compile both iOS slices and package the unsigned device app
        run: bash scripts/legado-ios/build-probe.sh 2>&1 | tee .build/ci-logs/probe-build.log
      - name: Run the native Zero probe in Simulator
        run: python -B scripts/legado-ios/run-simulator-probe.py --require-native-tcp --require-native-tls --require-native-http-wire --require-native-cpu-loop 2>&1 | tee .build/ci-logs/simulator-probe.log
      - name: Save the unsigned probe and its build manifest
        if: ${{ always() && hashFiles('.build/legado-ios/probe-output/LegadoRuntimeProbe-unsigned.ipa') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legado-probe-unsigned
          path: |
            .build/legado-ios/probe-output/LegadoRuntimeProbe-unsigned.ipa
            .build/legado-ios/probe-output/build-manifest.json
            .build/legado-ios/probe-output/README.txt
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Save Mac build diagnostics, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legado-macos-build-logs
          path: |
            .build/ci-logs/
            .build/legado-ios/mobile/build/*/configure.log
            .build/legado-ios/mobile/build/*/build.log
            .build/legado-ios/mobile/build/*/make-support/failure-summary
            .build/legado-ios/probe-device-linked-libraries.log
            .build/legado-ios/probe-device-exports.*
            .build/legado-ios/*.xcresult/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
      - name: Explain the remaining device gate
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          This workflow compiles the prototype and runs its synthetic fixture in Simulator. It does not sign, install, or run it on an iPhone/iPad.
          When packaging succeeds, download `legado-probe-unsigned`; its IPA must be signed separately before installation, even if the simulator step fails.
          On failure, inspect `legado-macos-build-logs` and the failing step. No fallback runtime is substituted.
          This cloud run cannot update physical-device gates. Historical build 6 device evidence is recorded separately; additions in this build still need a matching iPhone report.
          SUMMARY
