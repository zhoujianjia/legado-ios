name: Legado Original JSONPath Public API Observations

on:
  workflow_dispatch:
  push:
    tags:
      - 'legado-jsonpath-reference-*'

permissions:
  contents: read

concurrency:
  group: legado-jsonpath-reference-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  original-jsonpath:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate observation guards and stage the sanitized original source
        run: |
          mkdir -p .build/ci-logs/jsonpath-reference
          python -B scripts/legado-reference/test-jsonpath-reference.py -v 2>&1 | tee .build/ci-logs/jsonpath-reference/observation-guard-tests.log
          python -B scripts/legado-reference/test-prepare-reference.py -v 2>&1 | tee .build/ci-logs/jsonpath-reference/preparation-tests.log
          python -B scripts/legado-reference/test-run-reference.py -v 2>&1 | tee .build/ci-logs/jsonpath-reference/common-driver-tests.log
          python -B scripts/legado-reference/prepare-reference.py stage --snapshot-directory Packages/LegadoRuntime/vendor/android-reference --destination .build/legado-jsonpath-reference/source
          python -B scripts/legado-reference/run-jsonpath-reference.py stage
      - name: Install the required Android SDK command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Verify Android SDK and the existing emulator acceleration node
        run: |
          command -v sdkmanager
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Compile the original application and the independent public-API test
        run: |
          bash .build/legado-jsonpath-reference/source/gradlew -p .build/legado-jsonpath-reference/source --no-daemon --max-workers=2 \
            -I "$GITHUB_WORKSPACE/.build/legado-jsonpath-reference/source/reference.init.gradle" \
            -Dorg.gradle.jvmargs='-Xmx4g -Dfile.encoding=UTF-8' \
            :app:assembleAppDebug :app:assembleAppDebugAndroidTest --stacktrace \
            2>&1 | tee .build/ci-logs/jsonpath-reference/build.log
      - name: Collect all 36 original public JSONPath observations
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: python -B scripts/legado-reference/run-jsonpath-reference.py execute
      - name: Preserve original observations and diagnostics, including partial failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legado-original-jsonpath-observations
          path: |
            .build/ci-logs/jsonpath-reference/
            .build/legado-jsonpath-reference/source/app/build/outputs/androidTest-results/
            .build/legado-jsonpath-reference/source/app/build/reports/androidTests/
            .build/legado-jsonpath-reference/source/app/build/outputs/logs/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
      - name: State the observation boundary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          This isolated test invokes the original archive's public AnalyzeRule.getString(rule, false), getStringList(rule), and getElements(rule) on twelve fixed JSON inputs. It does not call Kotlin-internal helpers or install an onError handler. Three original business files and all snapshot source bytes are verified before overlays and after execution.
          A completed API call may return a value or throw an exception. Both are preserved as typed observations with explicit nulls. A successful run means all 36 observations were captured with the current instrumentation ID, fixture hash and original Application; it does not mean the port matches them.
          No private book source, network endpoint, production parser change or port comparator participates. The existing mainJs and eighteen scalar-replacement reference suites are unchanged. iOS, device, G4, compatibility and full-feature acceptance remain false. Failed setup, instrumentation, partial observation or stale metadata cannot pass.
          SUMMARY
