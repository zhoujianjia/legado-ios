name: Legado Reader Source Data Integration

on:
  push:
    tags:
      - 'legado-reader-data-*'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  runtime-interface:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      LEGADO_RUNTIME_SOURCE_ONLY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the installed Apple toolchain and test the Swift runtime interface
        run: |
          mkdir -p .build/ci-logs
          export DEVELOPER_DIR="$(bash scripts/sim.sh xcode)"
          # SwiftPM's serial XCTest runner does not emit xUnit XML (swiftlang/swift-package-manager#9961).
          # Use its reporting runner with one worker; this package contains XCTest tests only.
          swift test --package-path Packages/LegadoRuntime --parallel --num-workers 1 --disable-swift-testing --xunit-output "$PWD/.build/ci-logs/runtime-swift-tests.xml" 2>&1 | tee .build/ci-logs/runtime-swift-tests.log
          python3 -B scripts/reader-experience/data-smoke-tools.py verify-package --xml .build/ci-logs/runtime-swift-tests.xml --expected 21
      - name: Preserve exact runtime-interface results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legado-reader-runtime-interface-tests
          path: .build/ci-logs/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  source-data:
    runs-on: macos-15
    timeout-minutes: 85
    env:
      LEGADO_RUNTIME_SOURCE_ONLY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run the source-preservation and bundled-install regressions
        run: |
          mkdir -p .build/ci-logs .build/reader-data
          export DEVELOPER_DIR="$(bash scripts/sim.sh xcode)"
          export YUEDU_DEST="$(bash scripts/sim.sh dest)"
          python -B scripts/reader-experience/data-smoke-tools.py prepare --work .build/reader-data
          bash scripts/xctest.sh -l .build/reader-data/source-data-tests.log -t 2700 -- \
            -configuration Debug -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGN_ENTITLEMENTS= \
            GATEWAY_BASE_URL= YUEDU_LOCAL_EXPERIENCE=YES \
            -resultBundlePath .build/reader-data/source-data.xcresult \
            -only-testing:'yuedu appTests/BookSourceMainJSPreservationTests' \
            -only-testing:'yuedu appTests/BuiltInBookSourcesTests' \
            -only-testing:'yuedu appTests/LegadoMainJSSourceServiceTests'
          xcrun xcresulttool get test-results summary --path .build/reader-data/source-data.xcresult > .build/reader-data/source-data-summary.json
          python -B scripts/reader-experience/data-smoke-tools.py result --work .build/reader-data --expected 29
      - name: Preserve the actual source-data tests and failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legado-reader-source-data-tests
          path: |
            .build/ci-logs/
            .build/reader-data/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
