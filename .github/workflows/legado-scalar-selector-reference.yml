name: Legado Original Scalar Selector Public API Observations

on:
  workflow_dispatch:
  push:
    tags:
      - 'legado-scalar-selector-reference-*'

permissions:
  contents: read

concurrency:
  group: legado-scalar-selector-reference-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  original-scalar-selector:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate observation guards and stage the sanitized original source
        run: |
          mkdir -p .build/ci-logs/scalar-selector-reference
          python -B scripts/legado-reference/test-scalar-selector-reference.py -v 2>&1 | tee .build/ci-logs/scalar-selector-reference/observation-guard-tests.log
          python -B scripts/legado-reference/test-prepare-reference.py -v 2>&1 | tee .build/ci-logs/scalar-selector-reference/preparation-tests.log
          python -B scripts/legado-reference/test-run-reference.py -v 2>&1 | tee .build/ci-logs/scalar-selector-reference/common-driver-tests.log
          python -B scripts/legado-reference/prepare-reference.py stage --snapshot-directory Packages/LegadoRuntime/vendor/android-reference --destination .build/legado-scalar-selector-reference/source
          python -B scripts/legado-reference/run-scalar-selector-reference.py stage
      - name: Install the required Android SDK command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Verify Android SDK and the existing emulator acceleration node
        run: |
          command -v sdkmanager
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Compile the original application and the independent scalar-selector test
        run: |
          bash .build/legado-scalar-selector-reference/source/gradlew -p .build/legado-scalar-selector-reference/source --no-daemon --max-workers=2 \
            -I "$GITHUB_WORKSPACE/.build/legado-scalar-selector-reference/source/reference.init.gradle" \
            -Dorg.gradle.jvmargs='-Xmx4g -Dfile.encoding=UTF-8' \
            :app:assembleAppDebug :app:assembleAppDebugAndroidTest --stacktrace \
            2>&1 | tee .build/ci-logs/scalar-selector-reference/build.log
      - name: Collect all 28 original public scalar-selector observations
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: python -B scripts/legado-reference/run-scalar-selector-reference.py execute
      - name: Preserve original observations and diagnostics, including partial failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legado-original-scalar-selector-observations
          path: |
            .build/ci-logs/scalar-selector-reference/
            .build/legado-scalar-selector-reference/source/app/build/outputs/androidTest-results/
            .build/legado-scalar-selector-reference/source/app/build/reports/androidTests/
            .build/legado-scalar-selector-reference/source/app/build/outputs/logs/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
      - name: State the observation boundary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          This isolated producer calls the original AnalyzeRule.getString(rule, false) and getString(rule), with its default unescape argument, on fourteen public synthetic inputs. Both scalar calls use fresh AnalyzeRule instances; Element and JXNode setup uses only original public getElements and is not an API outcome.
          Raw String results, nullable exception fields, original inputs, context Java classes, current run identity and fixture/source fingerprints are preserved without trimming, unescaping or port normalization. Six original business files and all 2,747 sanitized snapshot files are checked before overlays and after execution. A successful run means 28 observations were completed, including any ordinary original API exceptions; setup, serialization, VM or linkage errors cannot pass.
          This is not a port comparison or a production parser change. No URL, private book source, network endpoint, new dependency, dynamic rule or capture-list projection participates. The existing eighteen static-replacement and thirty-six JSONPath suites remain unchanged. iOS, device, G4, compatibility and full-feature acceptance remain false.
          SUMMARY
