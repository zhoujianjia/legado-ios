name: Local Reader Renewal Probe Tests

on:
  push:
    tags:
      - 'reader-renewal-*'

permissions:
  contents: read

concurrency:
  group: reader-renewal-probe-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 95
    env:
      LEGADO_RUNTIME_SOURCE_ONLY: '1'
      YUEDU_RENEWAL_SELECTION: cryptography
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify the exact source tag and portable evidence guards
        run: |
          mkdir -p .build/ci-logs
          python -B scripts/reader-experience/renewal-probe-tools.py validate-tag
          python -B scripts/reader-experience/test-smoke-tools.py -v 2>&1 | tee .build/ci-logs/reader-renewal-existing-guards.log
          python -B scripts/reader-experience/test-renewal-probe-tools.py -v 2>&1 | tee .build/ci-logs/reader-renewal-guards.log
          python -B scripts/reader-experience/test-inspect-renewal-report.py -v 2>&1 | tee .build/ci-logs/reader-renewal-report-inspector-guards.log
          ruby scripts/check_localizations.rb
          bash -n scripts/reader-experience/renewal-probe-tests.sh
      - name: Select the installed toolchain and Simulator
        run: |
          export DEVELOPER_DIR="$(bash scripts/sim.sh xcode)"
          export YUEDU_DEST="$(bash scripts/sim.sh dest)"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo "YUEDU_DEST=$YUEDU_DEST" >> "$GITHUB_ENV"
          xcodebuild -version 2>&1 | tee .build/ci-logs/reader-renewal-xcode.log
      - name: Execute 25 signature hash CMS and provisioning fixture cases
        run: bash scripts/reader-experience/renewal-probe-tests.sh 2>&1 | tee .build/ci-logs/reader-renewal.log
      - name: Preserve probe test evidence without application binaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reader-renewal-probe-evidence
          path: |
            .build/reader-renewal-probe/
            .build/ci-logs/reader-renewal*.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
      - name: State the limited acceptance boundary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TEXT'
          This source-only Debug Simulator workflow fixes YUEDU_RENEWAL_SELECTION=cryptography and executes exactly 25 cases in one independently checked xcresult bundle: nine SelfRenewalMachOSignatureReaderTests, seven SelfRenewalCodeDirectoryHashVerifierTests, seven SelfRenewalCMSVerifierTests and two SelfRenewalProvisioningProfileVerifierTests. Exact qualified method identities, zero failures and zero skips are required. The nine structure cases are rechecked because their shared production reader changed. The independent signature artifact group is not accepted separately; its test identities are included in cryptography. Explicit all, replacement, implementation and signature modes retain their previous selections and budgets.
          Generated owned Mach-O fixtures exercise thin/fat layouts, CodeDirectory page and special-slot digests with SHA1, SHA256, truncated SHA256 and SHA384. Bounded owned directory fixtures connect real executable, Info.plist and CodeResources reads. These hashes are compared with untrusted CodeDirectories and do not authenticate CMS, certificates or an Apple signer. Matching the raw CodeResources digest does not validate its resource tree.
          Generic CMS cases perform actual RSA/ECDSA signature verification and chain evaluation against explicit owned fixture anchors at an explicit date, without trust-network access. Generic root trust does not establish Apple provisioning authority. Owned provisioning CMS envelopes provide checked content, but Apple-specific profile DER content, entitlement/device eligibility and install authorization remain unverified. No trusted replacement adapter, signer or installer is constructed.
          The single cryptography invocation permits the established 2700-second cold shared App/test-target compilation limit; timeout never counts as passing tests. It does not execute the unchanged transport 8, discovery 16, replacement 5, material-inventory 6 or diagnostic UI 1 suites, invoke a QueryType listener, browse RemotePairing, open diagnostic TCP, repeat reader smoke tests, or use an Apple account or real pairing file. Earlier runs retain independent evidence and are not accepted by this result. iPhone transport, automatic renewal, computer-powered-off and absence-of-companion-app conditions remain unverified or unmeasured.
          Exact source hashes, audited local-mode Info/project overlays, synthetic cloud configuration, final build settings, logs, xcresult bundles and UI attachments are retained. The actual built Info.plist must preserve Calibre and declare exactly one RemotePairing Bonjour service; its privacy fallback must match both source build configurations, and all five built privacy localizations must match their corresponding source values. The existing independent app identifiers require zero project replacements when already present. LEGADO_RUNTIME_SOURCE_ONLY=1 excludes the experimental JVM. No device archive, IPA or main-app binary is generated for distribution or uploaded by this workflow.
          TEXT
