name: Local Reader Renewal Probe Tests

on:
  push:
    tags:
      - 'reader-renewal-*'

permissions:
  contents: read

concurrency:
  group: reader-renewal-probe-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 95
    env:
      LEGADO_RUNTIME_SOURCE_ONLY: '1'
      YUEDU_RENEWAL_SELECTION: implementation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify the exact source tag and portable evidence guards
        run: |
          mkdir -p .build/ci-logs
          python -B scripts/reader-experience/renewal-probe-tools.py validate-tag
          python -B scripts/reader-experience/test-smoke-tools.py -v 2>&1 | tee .build/ci-logs/reader-renewal-existing-guards.log
          python -B scripts/reader-experience/test-renewal-probe-tools.py -v 2>&1 | tee .build/ci-logs/reader-renewal-guards.log
          python -B scripts/reader-experience/test-inspect-renewal-report.py -v 2>&1 | tee .build/ci-logs/reader-renewal-report-inspector-guards.log
          ruby scripts/check_localizations.rb
          bash -n scripts/reader-experience/renewal-probe-tests.sh
      - name: Select the installed toolchain and Simulator
        run: |
          export DEVELOPER_DIR="$(bash scripts/sim.sh xcode)"
          export YUEDU_DEST="$(bash scripts/sim.sh dest)"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo "YUEDU_DEST=$YUEDU_DEST" >> "$GITHUB_ENV"
          xcodebuild -version 2>&1 | tee .build/ci-logs/reader-renewal-xcode.log
      - name: Execute only five replacement and six material inventory cases
        run: bash scripts/reader-experience/renewal-probe-tests.sh 2>&1 | tee .build/ci-logs/reader-renewal.log
      - name: Preserve probe test evidence without application binaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reader-renewal-probe-evidence
          path: |
            .build/reader-renewal-probe/
            .build/ci-logs/reader-renewal*.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
      - name: State the limited acceptance boundary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TEXT'
          This source-only Debug Simulator workflow fixes YUEDU_RENEWAL_SELECTION=implementation and executes exactly five SelfRenewalReplacementPolicyTests and six SelfRenewalMaterialInventoryTests in two independently checked xcresult bundles, requiring their exact method identities, zero failures and zero skips. It does not execute or accept the unchanged transport 8, discovery 16 or diagnostic UI 1 groups. Explicit all mode retains its original transport/discovery/replacement/UI groups, while explicit replacement mode selects only its original five cases. Neither historical mode automatically accepts the new material cases. It does not repeat the reader smoke suite.
          The replacement-policy group uses synthetic installed/candidate metadata only. It checks identity and entitlement continuity for a same-version renewal, but does not read real certificates or profiles, attest caller-supplied authenticity, integrate a signer, or perform an installation. A metadata-compatible result leaves authentication, signing, replacement and renewal unverified.
          The material-inventory group reads real owned temporary directory fixtures, bounded plist metadata and potential signed-component inventory. These fixture bytes remain untrusted; no Mach-O signature, resource seal, CMS profile or certificate-chain authenticity is established. The first replacement invocation permits 2700 seconds for the cold shared App/test-target compilation; the following material invocation retains a 900-second warm limit. Both retain the original verdict and exact-leaf requirements; a timeout never counts as passing tests.
          The implementation selection neither invokes the fixed-port QueryType probe nor browses RemotePairing or opens diagnostic TCP connections. Passing establishes only the selected policy/inventory checks; it does not establish iPhone local-network privacy behavior, service identity, authentication, signing, installation or self-renewal. No Apple account or real pairing file is used. Computer-powered-off and absence-of-companion-app conditions remain unmeasured.
          Exact source hashes, audited local-mode Info/project overlays, synthetic cloud configuration, final build settings, logs, xcresult bundles and UI attachments are retained. The actual built Info.plist must preserve Calibre and declare exactly one RemotePairing Bonjour service; its privacy fallback must match both source build configurations, and all five built privacy localizations must match their corresponding source values. The existing independent app identifiers require zero project replacements when already present. LEGADO_RUNTIME_SOURCE_ONLY=1 excludes the experimental JVM. No device archive, IPA or main-app binary is generated for distribution or uploaded by this workflow.
          TEXT
