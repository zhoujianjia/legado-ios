name: Local Reader Renewal Probe Tests

on:
  push:
    tags:
      - 'reader-renewal-*'

permissions:
  contents: read

concurrency:
  group: reader-renewal-probe-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 125
    env:
      LEGADO_RUNTIME_SOURCE_ONLY: '1'
      YUEDU_RENEWAL_SELECTION: currentcore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify the exact source tag
        id: source
        run: |
          mkdir -p .build/ci-logs
          python -B scripts/reader-experience/renewal-probe-tools.py validate-tag
      - name: Verify portable evidence guards
        id: guards
        run: |
          python -B scripts/reader-experience/test-smoke-tools.py -v 2>&1 | tee .build/ci-logs/reader-renewal-existing-guards.log
          python -B scripts/reader-experience/test-renewal-probe-tools.py -v 2>&1 | tee .build/ci-logs/reader-renewal-guards.log
          python -B scripts/reader-experience/test-inspect-renewal-report.py -v 2>&1 | tee .build/ci-logs/reader-renewal-report-inspector-guards.log
          python -B scripts/reader-experience/test-original-api-package-tools.py -v 2>&1 | tee .build/ci-logs/reader-renewal-original-api-guards.log
          python -B scripts/reader-experience/owned-package-fixture/test-producer-diagnostics.py -v 2>&1 | tee .build/ci-logs/reader-renewal-producer-guards.log
          python -B scripts/reader-experience/owned-package-fixture/test-producer-timeouts.py -v 2>&1 | tee .build/ci-logs/reader-renewal-producer-timeout-guards.log
          python -B scripts/reader-experience/owned-package-fixture/test-producer-user-trust.py -v 2>&1 | tee .build/ci-logs/reader-renewal-producer-user-trust-guards.log
          ruby scripts/check_localizations.rb
          bash -n scripts/reader-experience/renewal-probe-tests.sh
          bash -n scripts/reader-experience/original-api-package-tests.sh
      - name: Select the installed toolchain and Simulator
        id: toolchain
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          export DEVELOPER_DIR="$(bash scripts/sim.sh xcode)"
          export YUEDU_DEST="$(bash scripts/sim.sh dest)"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo "YUEDU_DEST=$YUEDU_DEST" >> "$GITHUB_ENV"
          xcodebuild -version 2>&1 | tee .build/ci-logs/reader-renewal-xcode.log
      - name: Execute475 current-core definitions with478 exact native argument leaves
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        env:
          YUEDU_RENEWAL_PORTABLE_GUARDS_OUTCOME: ${{ steps.guards.outcome }}
        run: bash scripts/reader-experience/renewal-probe-tests.sh 2>&1 | tee .build/ci-logs/reader-renewal.log
      - name: Execute24 independent current-source macOS package XCTest cases
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && (env.YUEDU_RENEWAL_SELECTION == 'controlledsigning' || env.YUEDU_RENEWAL_SELECTION == 'transactionrenewal' || env.YUEDU_RENEWAL_SELECTION == 'handoffrenewal' || env.YUEDU_RENEWAL_SELECTION == 'currentcore') }}
        env:
          YUEDU_RENEWAL_PACKAGE_SELECTION: ${{ env.YUEDU_RENEWAL_SELECTION == 'currentcore' && 'loginv2' || '' }}
        run: bash scripts/reader-experience/original-api-package-tests.sh 2>&1 | tee .build/ci-logs/reader-renewal-original-api.log
      - name: Preserve independent package XCTest evidence without build products
        if: ${{ always() && (env.YUEDU_RENEWAL_SELECTION == 'controlledsigning' || env.YUEDU_RENEWAL_SELECTION == 'transactionrenewal' || env.YUEDU_RENEWAL_SELECTION == 'handoffrenewal' || env.YUEDU_RENEWAL_SELECTION == 'currentcore') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reader-renewal-original-api-evidence
          path: |
            .build/reader-renewal-original-api/
            .build/ci-logs/reader-renewal-original-api*.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
      - name: Preserve native evidence and allowlisted public SDK fixture outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reader-renewal-probe-evidence
          path: |
            .build/reader-renewal-probe/
            .build/ci-logs/reader-renewal*.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
      - name: State the limited acceptance boundary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TEXT'
          This fixed currentcore source boundary requires475 unique qualified native definitions and478 exact execution leaves, including both original Bool false/true pairs, the existing glyph nestedBackdrop Bool pair and the mandatory SDK-produced method. It is one cold3600-second invocation and one xcresult. It retains canonical retirement/AppOwner/foreground, Cookie text/WK, Unicode/preview/explore ownership and their affected regressions, and adds actual Vault CSR, account material, App-session lifecycle/GSA protocol and public content-batch cases, lost-ACK certificate reconciliation, original batch render-artifact cases and five existing default-option/media regressions and four actual-account expired-enrollment methods. The later production delta adds three all-source pause coordination methods, six first-enrollment/durable-binding methods, four explicit App execution methods, four automatic-trigger methods, seven measured real-JVM bundle methods, eight anisette v3 methods and three protected pairing-identity import methods. The directly affected pagination recovery boundary also selects all25 existing ChapterRetryLog/ReaderChapterSupply methods: five new ownership/recovery cases and20 retained publication, generation, content and nil-scope regressions. Four glyph/viewport methods and seven named existing composition, snapshot, curl and vertical-writing regressions extend this checkpoint only. Three actual raw source login-info App methods extend the existing credential-owner suite; the cookie fixture remains one existing method and the separate JNI shelf/login cases are outside native478. Four actual material-publication reconnect/Owner methods and the changed existing blankLoginFieldIsRequired caller regression extend this same checkpoint; original form-login product execution is selected separately by the required JNI host. Seven exploration page regressions (four new definitions and three affected existing cache cases) extend currentcore only. The already-selected blankLoginFieldIsRequired method now also checks the bounded original login-UI projection. One login-UI method, one cached-page lifecycle method and one original row-action method extend the separate original JNI host; Ordered login-UI callbacks are consumed by the existing form owner; a separate pure checked dismiss operation persists its working Map without authored login JS. Two additional methods extend the separate original JNI host. Four real App foreground/bootstrap lifecycle methods extend currentcore. A further physical-control reuse method extends the separate original JNI host, preserving actual old widget identity and input-binding skip/error boundaries. All changed Package inputs require a fresh independent24-method result. The same View also consumes the distinct original V2 protocol; its typed Package case requires a fresh24-method result and its native method remains in the separate JNI host. Four certificate reuse/profile lifecycle definitions and four preUpdate same-owner identity definitions extend currentcore only. The separate original host adds one preUpdate public-product method and one Android native-result platform characterization; its32 selections comprise29 product and3 platform methods. The independent cold-process pair remains separate, and the unactivated resource sniffer remains excluded. All prior mode sets, parameter identities and budgets remain unchanged; no benchmark, diagnostic UI/network, unmerged later work, or JVM replay is selected.

          Producer/staging/portable failures remain real workflow/full-gate failures while valid-source toolchain/native diagnostics still attempt the complete native selection. Every actual phase must succeed for result.json. Logs, exits/timeouts, raw xcresult Arguments and exact leaf identities, source/resource/built-loader hashes and the required same-job SDK fixture are fail-closed. Missing fixtures fail rather than skip or substitute. The producer uses an owned short-lived Keychain and a formally compiled C bridge; only validated public outputs are uploaded, never private keys/P12/passwords or the raw generation directory.

          Current Package source-only selection is24 exact XCTest methods with16 compilation inputs plus7 controls and a separate result. It explicitly selects loginv2: retained23 deltareuse methods plus one actual typed V2 protocol method. Original ten-case, unflagged currentcore sixteen-case, explicit publicbatch seventeen-case, effects eighteen-case loginui twenty-two-case and deltareuse twenty-three-case selections remain unchanged. Its current tag must actually execute; 9105/a835 or other old ten/sixteen-case evidence is historical, cannot be reused for these changed inputs, and never enters native466.

          The historical independent ten-case source-only SwiftPM pass at a835f8b remains source-scoped history, not current17 acceptance. Controlled fixtures do not establish Apple/device/account authorization; real private keys/P12/passwords are never artifact members; the source-bound pairing fixture embeds only freshly generated controlled test identities and a known fixture passphrase.

          Definitions and portable guard results are not SDK methods. App fixtures do not prove Apple/account/device authorization, a renewed installed profile, iPhone installation, cold launch, global data retention, full book-source compatibility or unattended renewal. iphoneTransportVerified, physicalDeviceValidationPassed, selfRenewalVerified and unattendedRenewalVerified remain false. Complete default App routing, UI rendering/navigation/buttons, all-source onPause, batch/cache/media and real automatic renewal remain unfinished.
          TEXT
