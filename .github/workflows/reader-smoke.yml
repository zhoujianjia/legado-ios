name: Yuedu Local Reader Smoke

on:
  push:
    tags:
      - 'reader-smoke-*'

permissions:
  contents: read

concurrency:
  group: reader-smoke-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify the source tag and portable smoke evidence guards
        run: |
          mkdir -p .build/ci-logs
          ruby scripts/check_localizations.rb
          python -B scripts/reader-experience/smoke-tools.py validate-tag
          python -B scripts/reader-experience/test-smoke-tools.py -v 2>&1 | tee .build/ci-logs/reader-smoke-tools.log
          python -B scripts/reader-experience/test-online-smoke-tools.py -v 2>&1 | tee .build/ci-logs/reader-online-tools.log
          python -B scripts/reader-experience/test-online-source-fixture.py -v 2>&1 | tee .build/ci-logs/reader-online-fixture.log
          bash -n scripts/reader-experience/smoke.sh
      - name: Check owned fixture readiness and cleanup before Xcode work
        run: |
          python -B scripts/reader-experience/run-online-smoke.py run \
            --work .build/reader-smoke-fixture-preflight -- python -c pass
      - name: Select the installed toolchain and Simulator
        run: |
          export DEVELOPER_DIR="$(bash scripts/sim.sh xcode)"
          export YUEDU_DEST="$(bash scripts/sim.sh dest)"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo "YUEDU_DEST=$YUEDU_DEST" >> "$GITHUB_ENV"
          xcodebuild -version 2>&1 | tee .build/ci-logs/reader-smoke-xcode.log
      - name: Execute configuration, source paging, TXT and loopback JSC reader cases
        env:
          LEGADO_RUNTIME_SOURCE_ONLY: '1'
        run: bash scripts/reader-experience/smoke.sh 2>&1 | tee .build/ci-logs/reader-smoke.log
      - name: Preserve screenshots, accessibility trees, results and failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reader-smoke-evidence
          path: |
            .build/ci-logs/
            .build/reader-smoke/
            .build/reader-smoke-fixture-preflight/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
      - name: State the exact acceptance boundary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TEXT'
          This run independently targets nine configuration tests, 41 local-product tests, twelve SearchAutoPagingTests, and one real TXT reader UI test. Every group requires its exact passing count and zero failures/skips. The product group exercises account-free feature availability without purchased entitlements, actual font bytes/licensing/UIFont registration, validated cache-only UTF-8 export including literal plain-text preservation, simplified UI, zero upstream Aozora catalog requests and the existing 13-case remote-library HTTP suite after the independent User-Agent change. Separate result bundles, summaries and logs are retained.
          The paging group exercises HTTP stubs through the existing HTML parser and source-script session: an explicit false verdict on page one prevents page two; true, invalid/unknown and cached-page verdicts keep the established bounded paging rules. The public onHasMore callback contract, device pacing and pause/resume regressions remain covered. This is not a live-site or native-JVM network acceptance claim.
          Source Info/project overlays establish isolated local mode before the test host first starts; their original and overlaid hashes are retained. The TXT test imports through the existing DEBUG hook, selects a chapter, closes, removes the import input and relaunches to verify persisted progress/body. Screenshots and accessibility trees are attached to the UI xcresult.
          One additional UI test imports a unique loopback book source through the real deep link, searches, opens details, adds the book, and reads two chapters through JavaScriptCore rules and CoreText. It requires exactly one passing test and zero skips, plus the owned server's complete request/response trace. Its verdict is saved separately from TXT acceptance.
          This is a Debug Simulator check of the existing Yuedu reader. It does not modify or execute the delivered Release IPA, validate the Files picker or real-site sources, or pass physical-device/full-Legado gates.
          TEXT
