name: Yuedu Local Reader Smoke

on:
  push:
    tags:
      - 'reader-smoke-*'

permissions:
  contents: read

concurrency:
  group: reader-smoke-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify the source tag and portable smoke evidence guards
        run: |
          mkdir -p .build/ci-logs
          ruby scripts/check_localizations.rb
          python -B scripts/reader-experience/smoke-tools.py validate-tag
          python -B scripts/reader-experience/test-check-completion-plan.py -v 2>&1 | tee .build/ci-logs/completion-plan-tools.log
          python -B scripts/reader-experience/check-completion-plan.py --require-execution --output .build/ci-logs/completion-plan.json
          python -B scripts/reader-experience/test-smoke-tools.py -v 2>&1 | tee .build/ci-logs/reader-smoke-tools.log
          python -B scripts/reader-experience/test-reader-stage-baseline.py -v 2>&1 | tee .build/ci-logs/reader-stage-baseline-tools.log
          python -B scripts/reader-experience/test-online-smoke-tools.py -v 2>&1 | tee .build/ci-logs/reader-online-tools.log
          python -B scripts/reader-experience/test-online-source-fixture.py -v 2>&1 | tee .build/ci-logs/reader-online-fixture.log
          bash -n scripts/reader-experience/smoke.sh
      - name: Check owned fixture readiness and cleanup before Xcode work
        run: |
          python -B scripts/reader-experience/run-online-smoke.py run \
            --work .build/reader-smoke-fixture-preflight -- python -c pass
      - name: Select the installed toolchain and Simulator
        run: |
          export DEVELOPER_DIR="$(bash scripts/sim.sh xcode)"
          export YUEDU_DEST="$(bash scripts/sim.sh dest)"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo "YUEDU_DEST=$YUEDU_DEST" >> "$GITHUB_ENV"
          xcodebuild -version 2>&1 | tee .build/ci-logs/reader-smoke-xcode.log
      - name: Execute existing smoke groups and the batch-end reader experience checks
        env:
          LEGADO_RUNTIME_SOURCE_ONLY: '1'
        run: bash scripts/reader-experience/smoke.sh 2>&1 | tee .build/ci-logs/reader-smoke.log
      - name: Preserve screenshots, accessibility trees, results and failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reader-smoke-evidence
          path: |
            .build/ci-logs/
            .build/reader-smoke/
            .build/reader-smoke-fixture-preflight/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
      - name: State the exact acceptance boundary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TEXT'
          This run independently targets nine configuration tests, 41 local-product tests, twelve SearchAutoPagingTests, and one real TXT reader UI test. Every group requires its exact passing count and zero failures/skips. The product group exercises account-free feature availability without purchased entitlements, actual font bytes/licensing/UIFont registration, validated cache-only UTF-8 export including literal plain-text preservation, simplified UI, zero upstream Aozora catalog requests and the existing 13-case remote-library HTTP suite after the independent User-Agent change. Separate result bundles, summaries and logs are retained.
          An independent position group requires 13 unique methods and 23 passing executions: five real-file persistence/fault-injection cases, twelve scroll restoration executions across TXT/Markdown/online plain text/online HTML, and six TXT reindex migration executions. The top-level xcresult summary counts methods; the selected device/configuration counts executions, and both gates require zero failures/skips. It retains its own raw tests tree and summary; this is not a physical-device storage or performance claim.
          The paging group exercises HTTP stubs through the existing HTML parser and source-script session: an explicit false verdict on page one prevents page two; true, invalid/unknown and cached-page verdicts keep the established bounded paging rules. The public onHasMore callback contract, device pacing and pause/resume regressions remain covered. This is not a live-site or native-JVM network acceptance claim.
          Source Info/project overlays establish isolated local mode before the test host first starts; their original and overlaid hashes are retained. The TXT test imports through the existing DEBUG hook, selects a chapter, closes, removes the import input and relaunches to verify persisted progress/body. Screenshots and accessibility trees are attached to the UI xcresult.
          The same TXT UI method now opens the real quick-reader panel, checks announced font-size changes and actual brightness percentages at both endpoints, restores those settings and dismisses the native sheet before continuing the persisted-reading check. Simulator accessibility evidence does not establish physical-device VoiceOver behavior.
          One additional UI test imports a unique loopback book source through the real deep link, searches, opens details, adds the book, and reads two chapters through JavaScriptCore rules and CoreText. It requires exactly one passing test and zero skips, plus the owned server's complete request/response trace. Its verdict is saved separately from TXT acceptance.
          An independent reader-experience group requires 60 unique methods and 62 passing executions, with zero failures, skips or expected failures at either level. It runs after paging and before either UI smoke so a later UI failure cannot hide its evidence. It covers nine settings-publication methods (including pending editor edits and repeated preset selection), twenty per-field scope methods, two real presented quick-panel layout/accessibility-size methods, six viewport observer methods and one SwiftUI hosting/resize method, ten layout-import methods, six settings-export methods, two live-style methods executed in paged and scroll modes (four executions), three restore/commit offset methods, and the single readerStageLatency benchmark method. Its xcresult, raw summary, raw tests tree, log and independent count-gate result are retained; this does not change any earlier group's acceptance or repeat the font and cold-scroll suites already selected above.
          A separate reader-supply-scenarios group requires three unique methods and six passing executions with zero failures, skips or expected failures. One prefetch method runs synthetic 20/100-chapter libraries through ten distant jumps using owned held URLProtocol responses and retains actual request/queue peaks, ordering, cancellation and recovery observations as READER_PREFETCH_SCENARIO log rows. Two modern-cache methods run four cases: replacement-body, empty-body and invalid-UTF-8 variants preserve their package/meta evidence for validation, and a chapter-entry path exercises one recovery fetch followed by verified cache reuse. This group also runs before UI smoke and keeps its own xcresult, raw summary/tests/log and count result. These fixtures do not establish live-site behavior, a changed production prefetch policy or device performance.
          A source-schema group independently requires nineteen unique methods and fifty passing executions with zero failures, skips or expected failures: ContentRule preservation 6/23, ReviewRule preservation 7/21 and existing mainJs preservation regressions 6/6. It retains ContentRule subContent/contentBatch/nullable maxBatchSize, all thirty original ReviewRule fields, and existing mainJs text through import, raw JSON editing, export and storage, with default, signed 32-bit boundary, malformed-input and session-clock cases. Its xcresult, summary, tests tree, log and count result are separate. This proves only the selected preservation contracts when these tests actually execute; it does not implement batch chapter or paragraph-review execution, full source-schema parity or original-core product routing.
          A separate WebDAV restore group requires twelve unique methods and twenty-seven passing executions with zero failures, skips or expected failures. It uses owned files/defaults and injected transport/install faults to verify all-present-file prevalidation, explicit-404 legacy absence, transfer/auth errors, no-data rejection, rollback including an already-mutated failed target, originally absent targets, retained disk recovery material after rollback failure, one later explicit retry, successful publication and rule deduplication, manifest conflict choices, and the real BookStore writer pause/drain/edit conflict plus local TOC/TXT migration boundary. This does not execute the live source/replace-store lease chain, full/encrypted backup, crash/power-loss recovery, WebDAV server interoperability or physical-device storage. It retains its own xcresult, raw summary/tests/log and count gate. All four new groups collect their evidence before their combined gate ahead of TXT UI; a failed group is never counted as passed.
          The selected reader-stage method measures fixed 10K/100K fixtures across five iterations and five stages. Its collector requires exactly 50 unique READER_ARCH_BENCH records, validates finite timing/output values, independently reconstructed fixture hashes and byte counts, and the 390x844 / 18pt / 1.5 line-height / 8pt paragraph style. It retains original log lines, fixture/benchmark/helper/collector source hashes, source commit, actual Debug build settings, Xcode/SDK/Simulator runtime build and destination evidence. Ten fixture/stage summaries report five-sample median/max observations; failed or skipped Swift assertions cannot be accepted by the timing collector. Raw metric lines survive invalid/incomplete captures without a passing baseline result.
          This is an in-process Debug Simulator baseline. It does not measure cold app startup, tap-to-visible, real HTTP, prefetch, peak process memory, battery or physical-device performance; five observations are not p95, and no speedup is established without a comparable earlier baseline. The separate source-session benchmark remains excluded.
          This is a Debug Simulator check of the existing Yuedu reader. It does not modify or execute the delivered Release IPA, validate the Files picker or real-site sources, or pass physical-device/full-Legado gates.
          TEXT
